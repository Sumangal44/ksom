[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ksom-lab"
version = "1.0.0"
description = "A professional, beginner-friendly Kohonen Self-Organizing Map library with beautiful visualizations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "rich>=13.0",
    "openpyxl>=3.1",
]


[tool.setuptools.packages.find]
include = ["ksom_lab*"]

[dependency-groups]
dev = [
    "build>=1.6.1",
    "pytest>=9.1.1",
    "twine>=7.0.0",
]
