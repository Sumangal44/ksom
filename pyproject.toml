[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ksom"
version = "1.0.0"
description = "A professional, beginner-friendly Kohonen Self-Organizing Map library with beautiful visualizations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["ksom*"]
